<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>to do list</title>
    <link rel="stylesheet" href="./CSS/style.css">
</head>

<body>
    <div id="container">
        <div class="anu">
            <div class="stats">
                <div class="titlenya" id="total">TOTAL TASKS</div>
                <div class="titlenya-value">0</div>
            </div>
            <div class="stats">
                <div class="titlenya" id="completed">COMPLETED</div>
                <div class="titlenya-done">0</div>
            </div>
            <div class="stats">
                <div class="titlenya" id="pending">PENDING</div>
                <div class="titlenya-wait">0</div>
            </div>
            <div class="stats">
                <div class="titlenya" id="progress">PROGRESS</div>
                <div class="titlenya-otw">0%</div>
            </div>
        </div>
        <div class="progress-bar">
            <div class="progress"></div>
        </div>

        <div class="form">
            <div class="forinput">
                <input type="text" class="skibidi" id="task-input" placeholder="Add a todo...">
                <input type="date" class="skibidi" id="date-input">
                <button class="add" onclick="addTask()">+</button>
            </div>
            <div class="search">
                <input type="search" class="searchh" id="searchTask" placeholder="Search task...">

            </div>
            <div>
                <select id="filter">
                    <option value="all">All</option>
                    <option value="completed">Completed</option>
                    <option value="pending">Pending</option>
                </select>
                <button class="delete">Delete All</button>
            </div>
            <div class="place table" id="taskplace">
                <table class="">
                    <thead>
                        <tr>
                            <th class="t1">Task</th>
                            <th class="t2">Due date</th>
                            <th class="t2">Status</th>
                            <th class="t2">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="todo" id="tasklist"></tbody>
                </table>
            </div>


        </div>

        <script src="./JS/script.js"></script>
</body>

</html>
